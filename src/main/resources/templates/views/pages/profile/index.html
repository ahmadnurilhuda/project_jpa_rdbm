<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
</head>
<body>
    <main layout:fragment="content">

        <div class="container mt-5">
            <h2 class="mb-4">My Profile</h2>

            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${user.username}"></h5>
                    <p class="card-text"><strong>Username:</strong> <span th:text="${user.username}">username</span></p>
                    <p class="card-text"><strong>Email:</strong> <span th:text="${user.email}">email</span></p>
                    <p class="card-text"><strong>Role:</strong> <span th:text="${user.role}">role</span></p>
                    <p class="card-text"><strong>Phone:</strong> <span th:text="${user.phone}">phone</span></p>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <a href="/" class="btn btn-primary">Back to Home</a>
                <a th:href="@{/profile/edit}" class="btn btn-warning">Edit Data Diri</a>
            </div>
        </div>
    </main>
    
</body>
</html>

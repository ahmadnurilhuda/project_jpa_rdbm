<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name}"></title>
</head>
<body>

    <main layout:fragment="content">

        <div class="container mt-5">
            <div class="row">
                <!-- Gambar Produk -->
                <div class="col-md-6">
                    <img th:src="@{${product.imageUrl}}" class="img-fluid rounded" th:alt="${product.name}" style="max-height: 500px; object-fit: contain;">
                </div>

                <!-- Detail Produk -->
                <div class="col-md-6">
                    <h2 th:text="${product.name}">Product Name</h2>
                    <p class="text-muted" th:text="'SKU: ' + ${product.sku}">SKU: xxx</p>
                    <h4 class="text-primary" th:text="'Rp ' + ${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}">Rp 0</h4>
                    <p><strong>Kategori:</strong> <span th:text="${product.category.name}">Kategori</span></p>
                    <p th:text="${product.description}">Deskripsi produk...</p>

                    <form action="#" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <div class="mb-3">
                            <label for="quantity" class="form-label">Jumlah:</label>
                            <input type="number" name="quantity" value="1" min="1" max="99" class="form-control" style="width: 120px;">
                        </div>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-cart-plus"></i> Tambah ke Keranjang
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Rata-rata Rating -->
        <div class="row mt-5">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-body d-flex align-items-center gap-3">
                        <h5 class="mb-0">Rating:</h5>
                        <i class="bi bi-star-fill text-warning fs-2"></i>
                        <span class="fs-2 fw-bold text-dark" th:text="${#numbers.formatDecimal(rating, 1, 1)}">4.5</span>
                        <span class="fs-5 text-muted">/ 5.0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div th:each="review : ${reviews}" class="col-md-6 mb-4">
                <div class="p-3 border rounded shadow-sm h-100">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <strong th:text="${review.user.username}">username</strong>
                            <span class="text-muted">|</span>
                            <small class="text-muted" th:text="${#dates.format(review.createdAt, 'dd MMM yyyy')}">28 Mei 2025</small>
                        </div>
                        <div class="d-flex">
                            <form class="me-1">
                                <button type="submit" class="btn btn-sm btn-outline-success" title="Upvote">
                                    <input type="hidden" name="reviewId" th:value="${review.id}">
                                    <i class="bi bi-hand-thumbs-up"></i>
                                </button>
                            </form>
                            <form method="post">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Downvote">
                                    <input type="hidden" name="reviewId" th:value="${review.id}">
                                    <i class="bi bi-hand-thumbs-down"></i>
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Bintang hanya jika rating ≠ 0 dan rating ≠ 5 -->
                     <div class="d-flex">
                        <div th:if="${review.rating != 0}" class="mb-2">
                            <i th:each="i : ${#numbers.sequence(1, review.rating)}" class="bi bi-star-fill text-warning"></i>
                        </div>
                        <div th:if="${review.rating != 5}">
                            <i th:each="i : ${#numbers.sequence(review.rating + 1, 5)}" class="bi bi-star text-warning"></i>
                        </div>
                    </div>
                    <p th:text="${review.content}" class="mb-0">Isi review</p>
                </div>
            </div>
        </div>

        <div class="row mt-5" th:if="${reviews.isEmpty()}">
            <div class="col-md-6 offset-md-3">
                <p class="text-muted">Belum ada review untuk produk ini.</p>
            </div>
        </div>







    </main>
    
</body>
</html>

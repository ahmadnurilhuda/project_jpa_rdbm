<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Voucher</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container mt-4">
            <h2 class="mb-4">Tambah Voucher</h2>
            <form th:action="@{/admin/vouchers/create}" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Nama Voucher</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="code" class="form-label">Kode Voucher</label>
                        <input type="text" id="code" name="code" class="form-control" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="discountType" class="form-label">Tipe Diskon</label>
                        <select id="discountType" name="discountType" class="form-select" required>
                            <option value="" disabled selected>Pilih tipe</option>
                            <option value="FIXED">FIXED</option>
                            <option value="PERCENTAGE">PERCENTAGE</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="discount" class="form-label">Nilai Diskon</label>
                        <input type="number" step="0.01" min="0" id="discount" name="discount" class="form-control" placeholder="Contoh: 50000 atau 10" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="quantity" class="form-label">Jumlah Voucher</label>
                    <input type="number" id="quantity" name="quantity" min="1" class="form-control" required>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/admin/vouchers}" class="btn btn-secondary">Kembali</a>
                    <button type="submit" class="btn btn-primary">Simpan Voucher</button>
                </div>
            </form>
        </div>

    </main>
    
</body>
</html>

<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>categories</title>
</head>
<body>
<main layout:fragment="content">
    <h1>Product Categories</h1>

    <div>
        <a href="/admin/categories/create" class="btn btn-primary">Create Category</a>
    </div>
    <!-- <div th:if="${message}" class="alert alert-success" th:text="${message}"></div> -->

    <table class="table table-striped">
        <thead>
            <tr>
                <th>No</th>
                <th>Name</th>
                <th>Description</th>
                <th>Created At (Date)</th>
                <th>Created At (Time)</th>
                <th>Updated At (Date)</th>
                <th>Updated At (Time)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="category, stat : ${categories.content}">
                <td th:text="${stat.count}"></td>
                <td th:text="${category.name}"></td>
                <td th:text="${category.description}"></td>
                <td th:text="${#dates.format(category.created_at, 'EEEE, dd MMMM yyyy')}"></td>
                <td th:text="${#dates.format(category.created_at, 'HH:mm:ss')}"></td>
                <td th:text="${#dates.format(category.updated_at, 'EEEE, dd MMMM yyyy')}"></td>
                <td th:text="${#dates.format(category.updated_at, 'HH:mm:ss')}"></td>

                <td class="d-flex gap-2 justify-content-center">
                    <a class="btn btn-warning" th:href="@{/admin/categories/edit/{id}(id=${category.id})}">Edit</a>
                    <form class="btn btn-danger" th:action="@{/admin/categories/delete/{id}(id=${category.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this category?') ">
                        <button type="submit" class="btn text-white p-0 m-0 border-0 shadow-none ">Delete</button>
                    </form>
                    
                    <a th:href="@{/admin/categories/{id}(id=${category.id})}" class="btn btn-info">Show Products</a>
                </td>
            </tr>
        </tbody>
    </table>

    <nav aria-label="Page navigation example" th:if="${metadata['totalPages'] != 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${metadata['number'] == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/categories(page=${metadata['number'] - 1})}">Previous</a>
            </li>
            <li class="page-item"
                th:each="page : ${#numbers.sequence(0, metadata['totalPages'] - 1)}"
                th:classappend="${metadata['number'] == page} ? 'active'">
                <a class="page-link" th:href="@{/admin/categories(page=${page})}" th:text="${page + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${metadata['number'] == metadata['totalPages'] - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/categories(page=${metadata['number'] + 1})}">Next</a>
            </li>
        </ul>
    </nav>
    
</main>
</body>
</html>

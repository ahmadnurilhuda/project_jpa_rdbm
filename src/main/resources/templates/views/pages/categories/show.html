<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
</head>
<body>
<main layout:fragment="content">
    <h1 th:text="${'List Products in Category ' + category.name}"></h1>

    <div>
        <a href="/products/create" class="btn btn-primary">New Product</a>
    </div>
    <!-- <div th:if="${message}" class="alert alert-success" th:text="${message}"></div> -->

    <table class="table table-striped">
        <thead>
            <tr>
                <th>No</th>
                <th>Name</th>
                <th>Description</th>
                <th>SKU</th>
                <th>Price</th>
                <th>Discount</th>
                <th>Quantity</th>
                <th>Category</th>
                <th>Created At (Date)</th>
                <th>Created At (Time)</th>
                <th>Updated At (Date)</th>
                <th>Updated At (Time)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product, stat : ${products}">
                <td th:text="${stat.count}"></td>
                <td th:text="${product.name}"></td>
                <td th:text="${product.description}"></td>
                <td th:text="${product.sku}"></td>
                <td th:text="${product.price}"></td>
                <td th:text="${product.discount}"></td>
                <td th:text="${product.quantity}"></td>
                <td th:text="${product.category.name}"></td>
                <td th:text="${#dates.format(product.created_at, 'EEEE, dd MMMM yyyy')}"></td>
                <td th:text="${#dates.format(product.created_at, 'HH:mm:ss')}"></td>
                <td th:text="${#dates.format(product.updated_at, 'EEEE, dd MMMM yyyy')}"></td>
                <td th:text="${#dates.format(product.updated_at, 'HH:mm:ss')}"></td>

                <td class="d-flex gap-2 justify-content-center">
                    <a class="btn btn-warning container " th:href="@{/products/edit/{id}(id=${product.id})}">Edit</a>
                    <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post" class="container">
                        <button class="btn btn-danger" type="submit" onClick="return confirm('Are you sure you want to delete this product?')">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>

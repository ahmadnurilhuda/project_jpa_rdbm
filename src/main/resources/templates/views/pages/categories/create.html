<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Category</title>
</head>
<body>

    <main layout:fragment="content">

        <h1>Create Category</h1>

        

        <form th:object="${category}" th:action="@{/categories}" method="POST" class="row g-3">

            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" name="name" placeholder="category name" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'" th:field="*{name}">
                <div class="form-text text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="col-md-12">
                <label for="description" class="form-label">Description</label>
                <textarea name="email" class="form-control" rows="10" placeholder="category description" th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'" th:field="*{description}"></textarea>
                <div class="form-text text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="col-md-12">
                <button type="submit" class="btn btn-primary">Create Category</button>
            </div>
        </form>

        <div class="mt-3">
            <a href="/categories" class="btn btn-secondary">Back To Categories</a>
        </div>

    </main>
    
</body>
</html>

<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <main layout:fragment="content">
        <!-- Container Tengah -->
        <div class="d-flex justify-content-center align-items-center mt-5">
            <div class="card shadow-sm p-4 w-100" style="max-width: 400px;">
                <!-- Judul -->
                <h4 class="mb-3 text-center">
                    <i class="bi bi-key-fill me-1"></i> Reset Password
                </h4>

                <!-- Alert -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-1"></i>
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Form -->
                <form th:action="@{/reset-password/{token}(token=${token})}" method="post">
                    <!-- Token (dari parameter URL) -->
                    <input type="hidden" name="token" th:value="${token}" />

                    <div class="mb-3">
                        <label for="newPassword" class="form-label">
                            <i class="bi bi-lock-fill me-1"></i> New Password
                        </label>
                        <input type="password" class="form-control" id="newPassword" name="newPassword"
                            placeholder="Enter new password" required>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            <i class="bi bi-lock-fill me-1"></i> Confirm Password
                        </label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                            placeholder="Repeat password" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle-fill me-1"></i> Reset Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
</body>
</html>

<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password</title>
</head>
<body>

    <main layout:fragment="content">


        <!-- Container Tengah -->
        <div class="d-flex justify-content-center align-items-center mt-5">
            <div class="card shadow-sm p-4 w-100" style="max-width: 400px;">
                <!-- Judul -->
                <h4 class="mb-3 text-center">
                    <i class="bi bi-shield-lock-fill me-1"></i> Forgot Password
                </h4>

                <!-- Alert -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-1"></i>
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Form -->
                <form th:action="@{/forgot-password}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope-fill me-1"></i>Email
                        </label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send-fill me-1"></i> Submit
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- <h1>Forgot Password</h1> -->
        <!-- <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div></div> -->



    </main>
    
</body>
</html>

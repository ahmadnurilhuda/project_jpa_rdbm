<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container my-4">
            <div class="row">
                <!-- Loop untuk setiap produk -->
                <div class="col-md-4 mb-4" th:each="product : ${products.content}">
                <div class="card h-100">
                    <img th:src="${product.imageUrl}" class="card-img-top" th:alt="${product.name}">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${product.name}"></h5>
                        <p class="card-text" th:text="${product.description}"></p>
                        <p class="card-text" th:text="${product.price}"></p>
                        <p class="card-text" th:text="${product.quantity}"></p>
                        <form action="/carts/add" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <button type="submit" class="btn btn-primary">Add to Cart</button>
                        </form>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>

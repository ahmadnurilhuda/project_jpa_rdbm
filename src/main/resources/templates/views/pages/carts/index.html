<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
</head>
<body>

    <main layout:fragment="content">
        <div class="container my-5">
            <h2 class="mb-4">Keranjang Belanja</h2>

            <div th:if="${#lists.isEmpty(cartItems)}">
                <p>Keranjang Anda kosong.</p>
            </div>

            <div class="row" th:each="item : ${cartItems}">
                <div class="col-md-12 mb-3">
                    <div class="card shadow-sm">
                        <div class="row g-0">
                            <div class="col-md-2">
                                <img th:src="${item.product.imageUrl}" class="img-fluid rounded-start"
                                    th:alt="${item.product.name}">
                            </div>
                            <div class="col-md-10">
                                <div class="card-body">
                                    <h5 class="card-title" th:text="${item.product.name}">Nama Produk</h5>
                                    <p class="card-text">Kategori:
                                        <span th:text="${item.product.category.name}">Kategori</span>
                                    </p>

                                    <div class="row">
                                        <div class="col-md-4">
                                            <p class="card-text">Jumlah: 
                                                <strong th:text="${item.quantity}">1</strong>
                                            </p>
                                        </div>
                                        <div class="col-md-4">
                                            <p class="card-text">Harga Satuan:
                                                <strong th:text="'Rp ' + ${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 2, 'POINT')}">Rp 0</strong>
                                            </p>
                                        </div>
                                        <div class="col-md-4">
                                            <p class="card-text">Subtotal:
                                                <strong th:text="'Rp ' + ${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'COMMA', 2, 'POINT')}">Rp 0</strong>
                                            </p>
                                        </div>
                                        <div class="col-md-12">
                                            <form action="/carts/remove" method="post">
                                                <input type="hidden" name="cartItemId" th:value="${item.id}">
                                                <button type="submit" class="btn btn-danger">Hapus</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4" th:if="${!#lists.isEmpty(cartItems)}">
                <div class="col-md-12 text-end">
                    <h4>Total Belanja: 
                        <span th:text="'Rp ' + ${#numbers.formatDecimal(total, 0, 'COMMA', 2, 'POINT')}">Rp 0</span>
                    </h4>
                </div>
            </div>


            <div class="row mt-4">
                <div class="col-md-6 d-grid" th:classappend="${#lists.isEmpty(cartItems)} ? 'w-100'">
                    <a href="/" class="btn btn-outline-primary" >Lanjutkan Belanja</a>
                </div>
                <div class="col-md-6 d-grid" th:if="${!#lists.isEmpty(cartItems)}">
                    <form action="/checkouts" method="post">
                        <button type="submit" class="btn btn-primary">Checkout</button>
                    </form>
                </div>
            </div>
            
        </div>
    </main>
    
</body>
</html>

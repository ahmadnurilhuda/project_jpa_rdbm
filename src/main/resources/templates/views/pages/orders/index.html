
<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>
</head>
<body>

    <main layout:fragment="content">
        <div class="container mt-4">
            <h2 class="mb-4">Daftar Semua Pesanan</h2>
            <div class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                    <thead class="table-dark text-center">
                        <tr>
                            <th>ID</th>
                            <th>Nama User</th>
                            <th>Tanggal</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td class="text-center" th:text="${order.id}">1</td>
                            <td th:text="${order.user.username}"></td>
                            <td class="text-center" th:text="${#temporals.format(order.created_at, 'dd MMM yyyy HH:mm')}"></td>
                            <td class="text-end" th:text="'Rp ' + ${#numbers.formatDecimal(order.amount, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td class="text-center" th:text="${order.status}">PENDING</td>
                            <td class="text-center">
                                <a th:href="@{'/admin/orders/{id}'(id=${order.id})}" class="btn btn-info btn-sm px-3">Detail</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
   


    
</body>
</html>

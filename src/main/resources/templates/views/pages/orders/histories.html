<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
</head>
<body>

    <main layout:fragment="content">
        <h2>Order History</h2>
            <div class="row row-cols-1 row-cols-md-2 g-4 mt-3">
                <div class="col" th:each="order : ${orders}">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <h5 class="card-title">Order ID: <strong>ORD-PRD-<span th:text="${order.id}"></span></strong></h5>
                            <p class="card-text">Amount: <strong><span th:text="'Rp ' + ${#numbers.formatDecimal(order.amount, 0, 'COMMA', 2, 'POINT')}"></span></strong></p>
                            <p class="card-text">Status: <strong><span th:text="${order.status}"></span></strong></p>
                            <p class="card-text">Date: <strong><span th:text="${#temporals.format(order.created_at, 'yyyy-MM-dd HH:mm')}"></span></strong></p>
                            <a th:href="@{/order-history/{id}(id=${order.id})}" class="btn btn-primary">View Detail</a>
                        </div>
                    </div>
                </div>
            </div>
    </main>
</body>
</html>

<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details</title>
</head>
<body>

    <main layout:fragment="content">

        <div class="container mt-4">
            <h2 class="mb-4">Detail Pesanan</h2>

            <!-- Info Pesanan -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5>ID Order: ORD-PRD- <span th:text="${order.id}"></span></h5>
                    <p>Nama User: <strong th:text="${order.user.username}"></strong></p>
                    <p>Tanggal Dibuat: <span th:text="${#temporals.format(order.created_at, 'dd MMM yyyy HH:mm')}"></span></p>
                    <p>Total Pesanan: <strong th:text="'Rp ' + ${#numbers.formatDecimal(order.amount, 0, 'COMMA', 2, 'POINT')}"></strong></p>
                    <p>Status Saat Ini: <strong th:text="${order.status}"></strong></p>
                </div>
            </div>

            <!-- Daftar Item Pesanan -->
            <div class="card mb-4">
                <div class="card-header">
                    <strong>Item Pesanan</strong>
                </div>
                <div class="card-body p-0">
                    <table class="table table-bordered table-striped m-0">
                        <thead class="table-light text-center">
                            <tr>
                                <th>No</th>
                                <th>Nama Produk</th>
                                <th>Qty</th>
                                <th>Harga</th>
                                <th>SubTotal</th>
                                
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item, stat : ${orderItems}">
                                <td class="text-center" th:text="${stat.index + 1}">1</td>
                                <td th:text="${item.product.name}">Nama Produk</td>
                                <td class="text-center" th:text="${item.quantity}"></td>
                                <td class="text-end" th:text="'Rp ' + ${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 2, 'POINT')}"></td>
                                <td class="text-end" th:text="'Rp ' + ${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'COMMA', 2, 'POINT')}"></td>
                                
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="4" class="text-end fw-bold">Total:</td>
                                <td class="text-end fw-bold" th:text="'Rp ' + ${#numbers.formatDecimal(order.amount, 0, 'COMMA', 2, 'POINT')}"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- Form Ubah Status -->
            <form th:action="@{/admin/orders/update-status}" method="post" class="w-50">
                <input type="hidden" name="orderId" th:value="${order.id}" />
                <div class="mb-3">
                    <label for="statusSelect" class="form-label">Ubah Status Pesanan</label>
                    <select id="statusSelect" name="status" class="form-select">
                        <option th:selected="${order.status.name() == 'PENDING'}" value="PENDING">PENDING</option>
                        <option th:selected="${order.status.name() == 'PROCESSED'}" value="PROCESSED">PROCESSED</option>
                        <option th:selected="${order.status.name() == 'COMPLETED'}" value="COMPLETED">COMPLETED</option>
                        <option th:selected="${order.status.name() == 'CANCELLED'}" value="CANCELLED">CANCELLED</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Simpan Perubahan</button>
                <a th:href="@{/admin/orders}" class="btn btn-secondary ms-2">Kembali</a>
            </form>
        </div>


    </main>


    
</body>
</html>

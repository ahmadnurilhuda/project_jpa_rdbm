<html lang="en" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
</head>
<body>

    <main layout:fragment="content">

        <h1>Edit Product</h1>

        <form th:object="${product}" th:action="@{/products/{id}(id=${product.id})}" method="POST" class="row g-3" enctype="multipart/form-data">

            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" name="name" placeholder="product name" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'" th:field="*{name}">
                <div class="form-text text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="col-md-12">
                <label for="description" class="form-label">Description</label>
                <textarea name="email" class="form-control" rows="10" placeholder="product description" th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'" th:field="*{description}"></textarea>
                <div class="form-text text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="col-md-6">
                <label for="price" class="form-label">Price</label>
                <input type="number" step="0.01" class="form-control" name="price" placeholder="product price" th:classappend="${#fields.hasErrors('price')} ? ' is-invalid'" th:field="*{price}">
                <div class="form-text text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <div class="col-md-6">
                <label for="discount" class="form-label">Discount</label>
                <input type="number" class="form-control" name="discount" placeholder="product discount" th:classappend="${#fields.hasErrors('discount')} ? ' is-invalid'" th:field="*{discount}">
                <div class="form-text text-danger" th:if="${#fields.hasErrors('discount')}" th:errors="*{discount}"></div>
            </div>
            <div class="col-md-6">
                <label for="quantity" class="form-label">Quantity</label>
                <input type="number" class="form-control" name="quantity" placeholder="product quantity" th:classappend="${#fields.hasErrors('quantity')} ? ' is-invalid'" th:field="*{quantity}">
                <div class="form-text text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
            </div>

            <div class="col-md-6">
                <label for="sku" class="form-label">Code SKU</label>
                <input type="text" class="form-control" name="sku" placeholder="product sku" th:classappend="${#fields.hasErrors('sku')} ? ' is-invalid'" th:field="*{sku}">
                <div class="form-text text-danger" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
            </div>

            <div class="col-md-6">
                <label for="category" class="form-label">Category</label>
                <select name="category" class="form-select" th:classappend="${#fields.hasErrors('category')} ? ' is-invalid'" th:field="*{category}">
                    <option value="" selected>Select Category</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                </select>
                <div class="form-text text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>

            <div class="col-md-6">
                <label for="image" class="form-label">Image</label>
                <input type="file" class="form-control" name="image" placeholder="product image">
            </div>

            <div class="col-md-12">
                <button type="submit" class="btn btn-primary">Create Product</button>
            </div>
        </form>

        <div class="mt-3">
            <a href="/products" class="btn btn-secondary">Back To Products</a>
        </div>

    </main>
    
</body>
</html>
